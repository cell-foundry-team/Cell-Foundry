[project]
name = "cell-foundry"
version = "0.1.0"
description = "Main environment for the Cell-Foundry project (DINOCell and the project scripts). The Cellpose-family models run in cellpose-env/, because dinocell pins cellpose==4.0.9."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cellpose>=4.0.9",
    "dinocell>=0.74",
    "huggingface-hub>=1.7.1",
    "imageio>=2.37.3",
    "jupyter>=1.1.1",
    "kornia>=0.8.3",
    "matplotlib>=3.10.8",
    "opencv-python-headless>=4.13.0.92",
    "pillow>=12.1.1",
    "scikit-image>=0.26.0",
    "scipy>=1.17.1",
    "tifffile>=2026.3.3",
    "timm>=1.0.30",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "transformers>=5.3.0",
    "wandb>=0.30.0",
]

[tool.uv.sources]
# On Linux/macOS, PyPI's own torch wheels already bundle CUDA (or MPS on macOS).
# On Windows, PyPI only ships CPU-only torch wheels, so without this override
# `uv sync` silently installs a CPU-only torch there and everything runs on CPU.
# Same idea as in cellpose-env/pyproject.toml, but cu128 instead of cu132: dinocell==0.74 pins
# torch==2.10.0, and the cu132 index has no torch 2.10.0. cu128 is the oldest CUDA build that
# supports RTX 50-series (Blackwell) GPUs.
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
